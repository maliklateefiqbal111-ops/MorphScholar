<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ResearchPath: research lifecycle advisor</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef2f6;--card:#fff;--soft:#f5f7fb;--ink:#1b2433;--mute:#5a6578;--line:#d5dce6;--acc:#2b3a8c;--bi:#fff;--rule:#b4232c;--warn:#8a4b00;--wsoft:#fdeccf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1420;--card:#171e2e;--soft:#1d2639;--ink:#e7ebf3;--mute:#9aa6bd;--line:#2a3550;--acc:#9db0ff;--bi:#0f1420;--rule:#ff7b83;--warn:#fbbf24;--wsoft:#33290f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1420;--card:#171e2e;--soft:#1d2639;--ink:#e7ebf3;--mute:#9aa6bd;--line:#2a3550;--acc:#9db0ff;--bi:#0f1420;--rule:#ff7b83;--warn:#fbbf24;--wsoft:#33290f}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:22px 16px 48px}
h1,h2{font-family:Georgia,"Times New Roman",serif}
h1{font-size:1.7rem;margin:0 0 4px}h2{font-size:1.15rem;margin:0 0 10px}h3{font-size:.95rem;margin:14px 0 4px}
.sub{color:var(--mute);margin:0 0 18px;max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--rule);border-radius:6px;padding:16px;margin-bottom:14px}
select{width:100%;font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:9px}
select:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.p{font-size:.8rem;border:1px solid var(--line);border-radius:3px;padding:2px 8px;color:var(--mute)}
.p.dn{background:var(--soft)}.p.on{background:var(--acc);border-color:var(--acc);color:var(--bi)}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:3px;padding:0 6px;margin-right:6px;color:var(--mute)}
.tag.h{border-color:var(--rule);color:var(--rule)}
.f{padding:8px 0;border-top:1px solid var(--line)}
.w{background:var(--wsoft);color:var(--warn);border-radius:4px;padding:8px 10px;margin:6px 0}
.chip{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:3px;padding:2px 8px;margin:0 6px 6px 0;font-size:.85rem}
details{margin-top:10px}summary{cursor:pointer;color:var(--acc)}
.note{color:var(--mute);font-size:.85rem;margin:8px 0 0}code{font-size:.85em}
</style></head>
<body><main>
<h1>ResearchPath</h1>
<p class="sub">An expert system that tells a researcher what to do now and next across the research lifecycle, and explains every recommendation rule by rule.</p>
<section class="card"><div class="grid" id="form"></div></section>
<div id="out"></div>
<script>
const $=i=>document.getElementById(i);
const ST=['Idea and topic','Literature review','Design and proposal','Data collection','Analysis','Writing','Publication','Dissemination and impact'];
const YN=[['n','No'],['y','Yes']];
const F=[['st','Current stage',ST.map((s,i)=>[i,s]),2],['lv','Your level',[['ma','Master’s student'],['phd','PhD scholar'],['ec','Early-career faculty'],['sr','Experienced researcher']],'phd'],['ap','Research approach',[['quant','Quantitative'],['qual','Qualitative'],['mixed','Mixed methods'],['biblio','Bibliometric or scientometric'],['review','Literature review']],'qual'],['hu','Human participants involved?',YN,'y'],['nd','Collecting new data?',YN,'y'],['gl','Main output',[['thesis','Thesis or dissertation'],['journal','Journal article'],['conf','Conference paper'],['grant','Grant proposal']],'thesis'],['apc','Can you pay article charges (APC)?',YN,'n']];
$('form').innerHTML=F.map(([k,t,o])=>`<div><label for="${k}">${t}</label><select id="${k}">${o.map(([v,x])=>`<option value="${v}">${x}</option>`).join('')}</select></div>`).join('');
F.forEach(([k,,,d])=>{$(k).value=d;$(k).onchange=run});
const Q=f=>f.ap==='quant'||f.ap==='mixed',L=f=>f.ap==='qual'||f.ap==='mixed';
const R=[
{id:'D1',ifs:'human participants = yes',when:f=>f.hu,set:{ethics:1},tag:'Ethics clearance needed'},
{id:'D2',ifs:'collecting new data = yes',when:f=>f.nd,set:{dmp:1},tag:'Data management plan needed'},
{id:'D3',ifs:'ethics needed and data management plan needed',when:f=>f.ethics&&f.dmp,set:{restricted:1},tag:'Restricted (personal) data'},
{id:'D4',ifs:'approach = literature review',when:f=>f.ap==='review',set:{guide:'PRISMA (systematic review) or PRISMA-ScR (scoping review)'},tag:'Reporting guideline: PRISMA family'},
{id:'D5',ifs:'approach = qualitative',when:f=>f.ap==='qual',set:{guide:'COREQ (interviews, focus groups) or SRQR'},tag:'Reporting guideline: COREQ or SRQR'},
{id:'D6',ifs:'output = thesis and level is master’s or PhD',when:f=>f.gl==='thesis'&&(f.lv==='ma'||f.lv==='phd'),set:{spin:1},tag:'Thesis should feed articles'},
{id:'A01',st:0,p:'H',ifs:'always',say:'Write the research question in one sentence and test it: is it answerable, original and feasible in your time?'},
{id:'A02',st:0,p:'H',ifs:'output = grant proposal',when:f=>f.gl==='grant',say:'Match the idea to a funder’s call early and read its eligibility and review criteria first.'},
{id:'A11',st:1,p:'M',ifs:'always',say:'Set up an ORCID iD and a reference-manager library (Zotero or Mendeley) before collecting sources.'},
{id:'A12',st:1,p:'H',ifs:'always',say:'Record the search strategy (databases, query strings, dates, filters) so the search can be repeated. Check for gaps in Scopus, Web of Science, LISTA and Google Scholar.'},
{id:'A13',st:1,p:'H',ifs:'approach = literature review (guideline derived)',when:f=>f.guide&&f.ap==='review',say:f=>'Name the review type and follow '+f.guide+'.'},
{id:'A14',st:1,p:'M',ifs:'approach = bibliometric',when:f=>f.ap==='biblio',say:'Pick one source (Scopus, Web of Science, Dimensions or open OpenAlex), fix the query and date, and note export limits.'},
{id:'A21',st:2,p:'H',ifs:'approach = quantitative or mixed',when:Q,say:'Fix the sample size (power analysis) and the analysis plan before collecting any data.'},
{id:'A22',st:2,p:'H',ifs:'approach = qualitative or mixed',when:L,say:'Define the sampling logic, the interview guide and how you will establish trustworthiness.'},
{id:'A23',st:2,p:'M',ifs:'approach = mixed methods',when:f=>f.ap==='mixed',say:'State why mixing is needed and choose a design: convergent, explanatory sequential or exploratory sequential.'},
{id:'A24',st:2,p:'H',ifs:'ethics clearance needed',when:f=>f.ethics,say:'Obtain ethics clearance before contacting participants; prepare the information sheet and consent form.'},
{id:'A25',st:2,p:'H',ifs:'data management plan needed',when:f=>f.dmp,say:'Draft a data management plan: data types, formats, storage, backup, access, and where the data will be shared.'},
{id:'A26',st:2,p:'H',ifs:'approach = bibliometric',when:f=>f.ap==='biblio',say:'Define inclusion criteria, the time window, cleaning rules and the indicators you will report.'},
{id:'A27',st:2,p:'M',ifs:'output = thesis',when:f=>f.gl==='thesis',say:'Get the synopsis approved and confirm your institution’s rules on publications and similarity limits.'},
{id:'A31',st:3,p:'H',ifs:'ethics clearance needed',when:f=>f.ethics,say:'Use only the approved instruments and consent procedure, and store signed consent forms apart from the data.'},
{id:'A32',st:3,p:'H',ifs:'restricted (personal) data',when:f=>f.restricted,say:'Pseudonymise at source and keep the identifier key in a separate, encrypted file.'},
{id:'A33',st:3,p:'M',ifs:'data management plan needed',when:f=>f.dmp,say:'Back up in two places and keep a dated log of versions and changes.'},
{id:'A34',st:3,p:'H',ifs:'approach = bibliometric',when:f=>f.ap==='biblio',say:'Export full records with cited references and save the raw files unchanged, with the query and date.'},
{id:'A41',st:4,p:'H',ifs:'approach = quantitative or mixed',when:Q,say:'Choose tests that fit the data type and distribution, and keep the script or syntax (SPSS, R, jamovi).'},
{id:'A42',st:4,p:'M',ifs:'approach = qualitative or mixed',when:L,say:'Code systematically (NVivo, ATLAS.ti or by hand), keep a codebook, and have a second person check some of the coding.'},
{id:'A43',st:4,p:'M',ifs:'approach = bibliometric',when:f=>f.ap==='biblio',say:'Clean author and keyword variants, then map networks with VOSviewer or Bibliometrix and report your thresholds.'},
{id:'A51',st:5,p:'H',ifs:'reporting guideline derived',when:f=>f.guide,say:f=>'Write to '+f.guide+' and attach the completed checklist.'},
{id:'A52',st:5,p:'M',ifs:'always',say:'Agree authorship order and contributions early, using CRediT roles.'},
{id:'A53',st:5,p:'H',ifs:'always',say:'Run a similarity check and close citation gaps before sharing the draft.'},
{id:'A54',st:5,p:'M',ifs:'thesis should feed articles',when:f=>f.spin,say:'Plan journal articles from thesis chapters in parallel rather than after submission.'},
{id:'A55',st:5,p:'M',ifs:'data management plan needed',when:f=>f.dmp,say:'Add a data availability statement saying where data and code are held and any access limits.'},
{id:'A61',st:6,p:'H',ifs:'output = journal article or thesis',when:f=>f.gl==='journal'||f.gl==='thesis',say:'Shortlist journals by scope fit, then verify indexing in Scopus, Web of Science or DOAJ.'},
{id:'A62',st:6,p:'H',ifs:'always',say:'Check unfamiliar journals with Think. Check. Submit.: look for fake metrics, vague peer review and pressure to pay.'},
{id:'A63',st:6,p:'H',ifs:'cannot pay article charges',when:f=>!f.apc,say:'Prefer subscription journals that allow green open access, or diamond open-access journals with no author fees.'},
{id:'A64',st:6,p:'M',ifs:'can pay article charges',when:f=>f.apc,say:'Ask whether your institution has a transformative agreement or fee waiver before paying.'},
{id:'A65',st:6,p:'H',ifs:'output = conference paper',when:f=>f.gl==='conf',say:'Check that the proceedings are indexed and that a recognised society or publisher runs the conference.'},
{id:'A71',st:7,p:'H',ifs:'always',say:'Deposit the accepted manuscript or preprint in a repository (institutional or Zenodo), following the publisher’s policy.'},
{id:'A72',st:7,p:'M',ifs:'data plan needed, data not restricted',when:f=>f.dmp&&!f.restricted,say:'Publish the dataset with a DOI (Zenodo, Figshare or OSF) and cite it in the paper.'},
{id:'A73',st:7,p:'H',ifs:'restricted (personal) data',when:f=>f.restricted,say:'Share only a de-identified version, or use controlled access, and say so in the paper.'},
{id:'A74',st:7,p:'M',ifs:'always',say:'Track impact with citations and the h, g and i10 indices, read against field norms, plus altmetrics for wider reach.'},
{id:'W1',w:1,ifs:'ethics needed and stage is data collection or later',when:f=>f.ethics&&f.st>=3,say:'You are at or past data collection with human participants. Confirm that ethics clearance was granted before continuing.'},
{id:'W2',w:1,ifs:'data plan needed and stage is data collection or later',when:f=>f.dmp&&f.st>=3,say:'Confirm a data management plan exists before collecting more data.'},
{id:'W3',w:1,ifs:'approach = bibliometric and human participants = yes',when:f=>f.ap==='biblio'&&f.hu,say:'Bibliometric data comes from databases, not people. If you are also surveying people, treat the design as mixed methods.'}];
function infer(f){const o=[];let go=true;while(go){go=false;for(const r of R)if(!o.includes(r)&&(r.when?r.when(f):true)){o.push(r);Object.assign(f,r.set||{});go=true}}return o}
const txt=(r,f)=>typeof r.say==='function'?r.say(f):r.say;
const rl=r=>`<div class="f"><span class="tag">${r.id}</span>IF <code>${r.ifs}</code> THEN ${r.set?Object.keys(r.set).join(', ')+' derived':r.w?'warn':'advise (stage '+(r.st+1)+')'}</div>`;
function run(){
 const f={};F.forEach(([k])=>f[k]=$(k).value);f.st=+f.st;f.hu=f.hu==='y';f.nd=f.nd==='y';f.apc=f.apc==='y';
 const tr=infer(f),acts=tr.filter(r=>r.st!==undefined),ws=tr.filter(r=>r.w),ds=tr.filter(r=>r.set);
 let road='';
 for(let s=f.st;s<8;s++){const a=acts.filter(r=>r.st===s).sort((x,y)=>(x.p==='H'?0:1)-(y.p==='H'?0:1));
  road+=`<h3>${s===f.st?'Now':'Next'}: ${ST[s]}</h3>`+a.map(r=>`<div class="f"><span class="tag">${r.id}</span><span class="tag${r.p==='H'?' h':''}">${r.p==='H'?'High':'Medium'}</span>${txt(r,f)}</div>`).join('')}
 $('out').innerHTML=`<section class="card"><h2>Where you are</h2><div class="pills">${ST.map((s,i)=>`<span class="p ${i<f.st?'dn':i===f.st?'on':''}">${s}</span>`).join('')}</div>
<p class="note">Facts the system derived from your answers:</p>${ds.length?ds.map(r=>`<span class="chip">${r.tag}</span>`).join(''):'<span class="note">none</span>'}
${ws.map(r=>`<div class="w"><span class="tag">${r.id}</span>${txt(r,f)}</div>`).join('')}</section>
<section class="card"><h2>Roadmap</h2>${road}<p class="note">Guidance is general. Check your institution’s and funder’s own rules, which take priority.</p></section>
<section class="card"><h2>Explanation and knowledge base</h2>
<details open><summary>Why these recommendations? ${tr.length} rules fired</summary>${tr.map(rl).join('')}</details>
<details><summary>All ${R.length} rules in the knowledge base</summary>${R.map(rl).join('')}</details></section>`}
run();
</script>
</main></body></html>
